<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday MyLove 🎂</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
      padding:20px;
    }

    .container{
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      padding:40px 25px;
      border-radius:25px;
      box-shadow:0 10px 40px rgba(0,0,0,0.2);
      max-width:500px;
      width:100%;
      animation: fadeIn 2s ease;
      z-index:2;
    }

    h1{
      font-size:2.5rem;
      color:white;
      margin-bottom:15px;
      text-shadow:0 3px 10px rgba(0,0,0,0.2);
    }

    h2{
      color:#fff;
      font-size:1.4rem;
      margin-bottom:20px;
    }

    p{
      color:white;
      font-size:1rem;
      line-height:1.7;
      margin-bottom:25px;
    }

    .btn{
      background:white;
      color:#ff4f81;
      border:none;
      padding:14px 28px;
      border-radius:50px;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 20px rgba(0,0,0,0.15);
    }

    .btn:hover{
      transform:scale(1.08);
      background:#ffe4ec;
    }

    /* Floating Hearts */
    .heart{
      position:absolute;
      color:#fff;
      font-size:20px;
      animation: float 6s linear infinite;
      opacity:0.8;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-120vh) scale(1.5);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .glow{
      animation: glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #fff;
      }
      to{
        text-shadow:0 0 25px #ff4f81,0 0 35px #ff4f81;
      }
    }

    @media(max-width:600px){
      h1{
        font-size:2rem;
      }

      h2{
        font-size:1.2rem;
      }

      p{
        font-size:0.95rem;
      }

      .container{
        padding:30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts -->
  <div class="heart" style="left:10%; animation-delay:0s;">❤</div>
  <div class="heart" style="left:25%; animation-delay:2s;">💖</div>
  <div class="heart" style="left:50%; animation-delay:4s;">❤</div>
  <div class="heart" style="left:75%; animation-delay:1s;">💕</div>
  <div class="heart" style="left:90%; animation-delay:3s;">❤</div>

  <div class="container">
    <h1 class="glow">🎂 Happy Birthday 🎂</h1>

    <h2>Dear MyLove 💖</h2>

    <p>
      Wishing you a day filled with happiness, love, smiles, and beautiful memories.
      You are truly special and deserve all the joy in the world today and always.
      May your life shine as bright as your smile ✨
    </p>

    <button class="btn" onclick="startCelebration()">
      Celebrate 🎉
    </button>
  </div>

  <script>
    function startCelebration(){

      // Confetti Blast
      confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
      });

      // Multiple Confetti Bursts
      let duration = 3 * 1000;
      let end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 80,
          origin: { x: 0 }
        });

        confetti({
          particleCount: 5,
          angle: 120,
          spread: 80,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());

      alert("Happy Birthday MyLove 💖🎂");
    }
  </script>

</body>
</html>
